<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>生成AIパスポート対策問題集</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 答案用紙（マークシート）を模した1カラム。選択肢は ア・イ・ウ・エ の丸いマーク。 */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#16202E; --mute:#566174; --line:#D3DAE4;
  --accent:#1B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --ok:#14804A; --ok-soft:#DDF3E6; --warn:#9A5800; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#FBE1DE;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --paper:#161D28; --ink:#E7ECF3; --mute:#9AA6B7; --line:#2A3443;
  --accent:#7FA2FF; --accent-ink:#0E131B; --accent-soft:#1E2B4A;
  --ok:#5FD08F; --ok-soft:#14301F; --warn:#F2B35A; --warn-soft:#3A2B10; --bad:#FF8A7C; --bad-soft:#3C1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --paper:#161D28; --ink:#E7ECF3; --mute:#9AA6B7; --line:#2A3443;
  --accent:#7FA2FF; --accent-ink:#0E131B; --accent-soft:#1E2B4A;
  --ok:#5FD08F; --ok-soft:#14301F; --warn:#F2B35A; --warn-soft:#3A2B10; --bad:#FF8A7C; --bad-soft:#3C1A17; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:20px 48px}
*{box-sizing:border-box}
#app{max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.4;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:transparent;padding:9px 18px;border-radius:6px;font-weight:700}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
.sheet>*+*{margin-top:14px}

.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:700}
.lines{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;background:var(--paper)}
.chip b{font-family:var(--f-mono)}

.chrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.chrow:first-of-type{border-top:0}
.chno{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.08em}
.chname{font-weight:700}
@media(max-width:560px){.chrow{grid-template-columns:minmax(0,1fr) auto}.chrow .bar{grid-column:1/-1;order:3}}

.bar{position:relative;height:10px;border-radius:5px;background:var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.barlab{font-family:var(--f-mono);font-size:12px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 18px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.gtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px}
.fchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.glist{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 4px;align-items:start}
.grow:hover{background:var(--accent-soft)}
.grow .gt{font-weight:700;overflow-wrap:anywhere}
.grow .gc{display:block;font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.08em}
.grow .gh{color:var(--mute);font-size:13px}
.grow .gd{display:none}
.grow .gf{display:block;font-weight:700;font-size:13px;margin-bottom:2px}
.grow.open .gd{display:block}.grow.open .gh{display:none}
/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.clock small{font-size:12px;color:var(--mute);margin-right:6px;font-family:var(--f-body)}
.clock.low{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.qno{font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.qtext{font-size:17px;font-weight:500;line-height:1.8}
.hint{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 10px;font-size:13px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.mark{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .t{min-width:0;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mark{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mark{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt[disabled]{cursor:default}
.fb{border-radius:8px;padding:14px 16px;background:var(--accent-soft)}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.gb{height:34px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-size:13px}
.gb.ans{background:var(--accent-soft);border-color:var(--accent)}
.gb.cur{border-color:var(--ink);border-width:2px}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.confirm{border:1.5px dashed var(--warn);border-radius:8px;padding:14px 16px;background:var(--warn-soft)}

/* result */
.verdict{border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft)} .verdict.mid{background:var(--warn-soft)} .verdict.low{background:var(--bad-soft)}
.verdict .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.3}
.verdict.ok .big{color:var(--ok)} .verdict.mid .big{color:var(--warn)} .verdict.low .big{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--paper)}
.stat .k{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.rv{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 8px;margin-right:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.ch{background:var(--accent-soft);color:var(--accent)}
.ans{font-size:14px}
.notes{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.notes li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7}
.notes li>div{min-width:0}
.notes .mk{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:12px;font-weight:700}
.notes li.r .mk{border-color:var(--ok);color:var(--ok)}
.nd{margin-top:4px}
.nd summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px}
.src{font-size:12px;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.prog i,.bar i{transition:width .3s}}
</style>

<div id="app"></div>

<script>
const CH=[
 {id:1,name:"AI（人工知能）"},
 {id:2,name:"生成AI"},
 {id:3,name:"現在の生成AIの動向"},
 {id:4,name:"情報リテラシー・基本理念とAI社会原則"},
 {id:5,name:"プロンプトの書き方"}
];
const Q=[
/* 第1章 */
{c:1,q:"「人工知能」という言葉が初めて使われたとされる、1956年に開かれた会議はどれですか。",ch:["ダートマス会議","チューリング会議","ジュネーブ会議","シリコンバレー会議"],a:[0],e:"1956年のダートマス会議で、ジョン・マッカーシーらが「人工知能」という言葉を使ったとされています。ここからAI研究の歴史が始まったと整理されます。"},
{c:1,q:"「入力データ」と「正解」のペアを大量に与えて学習させる方法を何といいますか。",ch:["教師あり学習","教師なし学習","強化学習","転移学習"],a:[0],e:"教師あり学習は、答え付きの問題集で勉強するイメージです。例：猫の写真に「猫」という答えを付けて学習させ、新しい写真が猫かどうかを当てられるようにします。"},
{c:1,q:"正解のないデータから、似たもの同士をグループに分けるなど、データの特徴やまとまりを見つけ出す学習方法はどれですか。",ch:["教師なし学習","教師あり学習","強化学習","模倣学習"],a:[0],e:"教師なし学習は、答えを与えずにデータの中の規則性を見つけさせる方法です。似たものをまとめる作業を「クラスタリング」といいます。"},
{c:1,q:"AIが試行錯誤しながら行動し、得られる「報酬」が大きくなるように学習する方法はどれですか。",ch:["強化学習","教師あり学習","教師なし学習","半教師あり学習"],a:[0],e:"強化学習は、ゲームで高得点を目指して何度も遊びながら上達するイメージです。囲碁AIやロボットの制御などに使われます。"},
{c:1,q:"人間の脳の神経細胞のつながりをまねた仕組みを、何層にも深く重ねた機械学習の手法はどれですか。",ch:["ディープラーニング","決定木","ベイズ推定","k平均法"],a:[0],e:"ディープラーニングは「層を深くしたニューラルネットワーク」を使う手法です。画像認識や音声認識の精度を大きく伸ばし、今の生成AIの土台にもなっています。"},
{c:1,q:"訓練に使ったデータには非常によく当てはまるのに、新しいデータでは精度が下がってしまう状態を何といいますか。",ch:["過学習","未学習","転移学習","正則化"],a:[0],e:"過学習は、過去問を丸暗記して、少し違う問題が出ると解けなくなる状態に似ています。未学習はその逆で、そもそも十分に学習できていない状態です。"},
{c:1,q:"「来月の売上金額を予測する」のように、連続した数値を予測する問題は、一般に何と呼ばれますか。",ch:["回帰","分類","クラスタリング","次元削減"],a:[0],e:"数値そのものを予測するのが「回帰」です。一方、「迷惑メールかどうか」のように種類（カテゴリ）を当てる問題は「分類」といいます。"},
{c:1,q:"チェスや画像認識など、特定の作業だけをこなすAIを何といいますか。",ch:["特化型AI","汎用AI","自己増殖AI","量子AI"],a:[0],e:"現在実用化されているAIは、基本的に特定の目的に特化した「特化型AI」です。人間のようにあらゆる課題をこなす「汎用AI（強いAI）」は、まだ実現していません。"},
{c:1,q:"2010年代以降のいわゆる第3次AIブームを支えた要因として、最も適切なものはどれですか。",ch:["大量のデータと計算能力の向上、ディープラーニングの発展","専門家の知識を人の手でルールとして書き込む「エキスパートシステム」の普及","パーセプトロンの発明","コンピュータの小型化だけ"],a:[0],e:"第3次ブームは、データの増加・コンピュータの性能向上・ディープラーニングの進歩がそろったことで起きました。エキスパートシステムは第2次ブームの中心でした。"},
{c:1,q:"機械学習の代表的な学習方法として正しいものを2つ選んでください。",ch:["教師あり学習","暗号化学習","強化学習","圧縮学習"],a:[0,2],e:"機械学習の代表的な学習方法は「教師あり学習」「教師なし学習」「強化学習」の3つです。「暗号化学習」「圧縮学習」という学習方法は一般的ではありません。"},
/* 第2章 */
{c:2,q:"生成AIの説明として最も適切なものはどれですか。",ch:["大量のデータから学習し、文章・画像・音声などの新しいコンテンツを作り出すAI","データを分類して、あらかじめ決められたラベルを付けることだけを行うAI","インターネット上の情報を保存するだけのデータベース","人間の操作なしに必ず正しい答えを出すAI"],a:[0],e:"生成AIは、学習したデータの特徴をもとに、新しい文章・画像・音声・動画などを「生成」できるAIです。出力が必ず正しいとは限らない点も重要です。"},
{c:2,q:"現在の多くの大規模言語モデルの土台になっている、2017年に発表されたモデルの構造はどれですか。",ch:["Transformer","RNN","決定木","k近傍法"],a:[0],e:"Transformerは、文の中の言葉どうしの関連の強さに注目する「アテンション（注意機構）」を使った構造で、2017年にGoogleの研究者らが発表しました。GPTのTも、これを指します。"},
{c:2,q:"2つのAI（偽物を作る側と、本物か偽物かを見分ける側）が競い合うことで、よりリアルなデータを作れるようにする仕組みはどれですか。",ch:["GAN","拡散モデル","強化学習","主成分分析"],a:[0],e:"GANは、偽札を作る人と見破る警察が腕を競い合うようなイメージです。作る側を「生成器」、見分ける側を「識別器」といいます。"},
{c:2,q:"画像生成に使われる技術として正しいものを2つ選んでください。",ch:["拡散モデル","決定木","GAN","線形回帰"],a:[0,2],e:"拡散モデルは、ノイズ（ざらざらした状態）から少しずつ整えて画像を作る方法で、近年の画像生成の主流です。GANも画像生成に使われてきました。決定木と線形回帰は、主に分類や予測に使う手法です。"},
{c:2,q:"LLMの説明として最も適切なものはどれですか。",ch:["膨大な量の文章データで学習し、言葉の並びのパターンをもとに文章を生成・理解するモデル","画像だけを学習して動画を作るモデル","ルールをすべて人手で書き込んだ会話プログラム","検索結果の順位だけを決めるプログラム"],a:[0],e:"LLMはLarge Language Modelの略です。大量の文章から言葉のつながり方を学び、質問への回答・要約・翻訳などができます。ChatGPTやGemini、Claudeの中身がこれにあたります。"},
{c:2,q:"対話型AI「ChatGPT」を開発した企業はどれですか。",ch:["OpenAI","Anthropic","Google","Microsoft"],a:[0],e:"ChatGPTはOpenAIが開発し、2022年11月に公開されました。Anthropicは「Claude」、Googleは「Gemini」、Microsoftは「Copilot」を提供しています。"},
{c:2,q:"ChatGPTなどに使われる「GPT」は、何の略ですか。",ch:["Generative Pre-trained Transformer","General Purpose Technology","Graphical Processing Tool","Generated Prompt Text"],a:[0],e:"Generative（生成する）、Pre-trained（事前に学習済みの）、Transformer（トランスフォーマー）の頭文字です。"},
{c:2,q:"対話AIを人間の好みや意図に近づけるために使われる、人間の評価を取り入れた学習方法はどれですか。",ch:["RLHF","GAN","転移学習","バッチ処理"],a:[0],e:"RLHFは、AIの回答に人間が点数や順位を付け、そのフィードバックを使ってAIをより望ましい回答へ近づける方法です。回答の自然さや安全性を高めるために使われます。"},
{c:2,q:"LLMが文章を処理するときの基本的な単位を何といいますか。",ch:["トークン","ピクセル","フレーム","ノード"],a:[0],e:"トークンは、単語や文字の一部などにあたる細かな単位です。一度に扱える量の上限や、利用料金がトークンの数で決まるサービスも多くあります。"},
{c:2,q:"次の組み合わせのうち、サービス名と提供企業が正しいものはどれですか。",ch:["Claude － Anthropic","Gemini － Microsoft","Copilot － Google","ChatGPT － Meta"],a:[0],e:"正しい組み合わせは、Claude－Anthropic、Gemini－Google、Copilot－Microsoft、ChatGPT－OpenAIです。2026年シラバスで新しくGemini・Claude・Copilotへの言及が追加されています。"},
/* 第3章 */
{c:3,q:"RAGの説明として最も適切なものはどれですか。",ch:["質問に関連する外部の情報を検索し、その内容を使ってAIに回答を作らせる仕組み","AIの学習データを全部入れ替えて再学習する仕組み","画像を高画質にする仕組み","AIの回答を暗号化して保存する仕組み"],a:[0],e:"RAGはRetrieval-Augmented Generationの略です。AIが答える前に、社内資料などから関連する情報を探して渡すことで、根拠のある回答を作りやすくします。"},
{c:3,q:"RAGを使う利点として、最も適切なものはどれですか。",ch:["社内資料や最新情報に基づいた回答をさせやすくなり、誤りを減らす助けになる","ハルシネーションが完全になくなる","AIの学習が一切不要になる","どんな質問にも必ず正解を返せる"],a:[0],e:"RAGは、最新情報や社内情報を参照できる点が強みで、誤りを減らす助けになります。ただし、誤りが完全になくなるわけではないので、確認は必要です。"},
{c:3,q:"RAGで、長い文書を検索しやすい大きさに分割したまとまりを何といいますか。",ch:["チャンク","トークン","パッチ","レイヤー"],a:[0],e:"チャンクは「かたまり」という意味です。長い文書を適切な長さに区切って保存しておくと、質問に合った部分だけを探し出しやすくなります。"},
{c:3,q:"文章の意味を数値の並びに変えて保存し、意味が近い内容を素早く探せるようにしたデータベースを何といいますか。",ch:["ベクトルデータベース","リレーショナルデータベース","ブロックチェーン","キャッシュサーバー"],a:[0],e:"ベクトルデータベースは、言葉が完全に一致しなくても「意味が近いもの」を探せるのが特徴です。RAGで、質問に関連するチャンクを探すために使われます。"},
{c:3,q:"AIエージェントの説明として最も適切なものはどれですか。",ch:["目標を与えられると、自分で手順を考え、検索やアプリなどの道具を使いながら作業を進めるAI","人間の質問に一度だけ短く答えるAI","インターネットから切り離して動く専用機械","学習済みのモデルを再配布するための仕組み"],a:[0],e:"AIエージェントは、質問に答えるだけでなく、計画を立てて道具を使い、作業を最後まで進めるAIです。2026年シラバスで新しく追加された項目です。"},
{c:3,q:"AIと外部のツールやデータをつなぐための共通ルールとして知られているものはどれですか。",ch:["MCP","HTTP","SMTP","DNS"],a:[0],e:"MCPは、AIが外部のツールやデータに接続するための共通の接続方法です。機器の差し込み口を共通にするUSBのように、つなぎ方を統一する役割です。"},
{c:3,q:"文章だけでなく、画像・音声・動画など複数の種類のデータを組み合わせて扱えるAIの特徴を何といいますか。",ch:["マルチモーダル","マルチタスク","オーバーフィッティング","スケーラビリティ"],a:[0],e:"「モーダル」は情報の種類（モード）のことです。複数の種類を扱えるので「マルチモーダル」といいます。"},
{c:3,q:"Googleが開発した、指示文などから動画を生成するAIモデルはどれですか。",ch:["Veo","Whisper","BERT","AlphaGo"],a:[0],e:"Veoは動画生成のAIです。Whisperは音声認識、BERTは言語理解、AlphaGoは囲碁のAIです。2026年シラバスでは、画像・動画生成の主流技術が更新されています。"},
{c:3,q:"文章を作るときのように、「次に来る要素」を順番に予測しながら出力を組み立てていく方式を何といいますか。",ch:["自己回帰モデル","拡散モデル","敵対的生成","クラスタリング"],a:[0],e:"自己回帰モデルは、直前までの内容から次を1つずつ予測してつなげる方式です。文章生成で広く使われ、画像生成にも応用されています。"},
{c:3,q:"RAGと比べた、ファインチューニングの特徴として正しいものはどれですか。",ch:["AIモデル自体に追加のデータを学習させ、得意分野や振る舞いを調整する","検索のたびに外部の資料を参照するだけで、モデルは変わらない","AIの利用料金を必ず無料にする","画像を文章に変換するだけの方法"],a:[0],e:"ファインチューニングは、すでにあるモデルに追加で学習をさせて調整する方法です。RAGはモデルを変えず、回答のたびに外部の情報を参照させる方法です。"},
/* 第4章 */
{c:4,q:"生成AIが事実と異なる内容を、もっともらしく出力してしまう現象を何といいますか。",ch:["ハルシネーション","フィッシング","オーバーフロー","スプーフィング"],a:[0],e:"ハルシネーションは「幻覚」という意味です。対策として、出典を確認する、重要な内容は人が必ず確かめる、といった使い方が大切です。"},
{c:4,q:"生成AIに個人情報や会社の機密情報を入力する際のリスクとして、最も適切なものはどれですか。",ch:["入力した内容が学習に使われたり外部に漏れたりするおそれがあるため、サービスの設定や社内ルールの確認が必要","入力した内容は必ず自動的に削除されるので問題ない","個人情報はAIに入力するほど精度が上がる","無料版でも有料版でも扱いは必ず同じ"],a:[0],e:"サービスによって、入力内容の扱いは異なります。個人情報・機密情報は、入力してよいかを事前に確認し、必要に応じて学習に使われない設定を使うことが重要です。"},
{c:4,q:"生成AIで作った画像が、他人の著作物と似ていて、かつその著作物をもとにしていた場合、どうなる可能性がありますか。",ch:["著作権侵害と判断される可能性がある","AIが作ったものなので常に侵害にならない","似ていれば必ず無料で使える","法律上は一切問題にならない"],a:[0],e:"著作権侵害かどうかは、「類似性（似ているか）」と「依拠性（元の作品をもとにしたか）」で判断されます。AIが作ったという理由だけで、侵害にならないわけではありません。"},
{c:4,q:"日本の著作権法で、AIの学習など情報解析を目的とした著作物の利用は、原則としてどう扱われていますか。",ch:["一定の条件のもとで、著作権者の許諾なく利用できる","いかなる場合も著作権者の許諾が必要","公開されている著作物なら一切の制限がない","海外のサービスに限り許諾が不要"],a:[0],e:"著作権法第30条の4で、情報解析などの目的なら、原則として許諾なく利用できるとされています。ただし、著作権者の利益を不当に害する場合は認められません。細かな条件はテキストで確認してください。"},
{c:4,q:"AI事業者ガイドラインが想定している、AIに関わる主な3つの事業者の区分はどれですか。",ch:["AI開発者・AI提供者・AI利用者","AI研究者・AI販売者・AI監査人","AI設計者・AI管理者・AI廃棄者","政府・企業・個人"],a:[0],e:"AIを作る「開発者」、AIを使ったサービスを出す「提供者」、AIを業務などで使う「利用者」の3区分です。立場ごとに、守るべきポイントが整理されています。"},
{c:4,q:"「AI事業者ガイドライン」を取りまとめて公表している省庁の組み合わせはどれですか。",ch:["総務省と経済産業省","文部科学省と厚生労働省","財務省と国土交通省","内閣府とデジタル庁だけ"],a:[0],e:"AI事業者ガイドラインは、総務省と経済産業省がまとめています。2026年シラバスでは第1.0版から第1.1版へ改訂されています。"},
{c:4,q:"2025年に成立した「AI新法」の基本的な考え方として、最も適切なものはどれですか。",ch:["AIの研究開発と活用を進めつつ、不適切な利用などのリスクにも対応する","AIの開発と利用を全面的に禁止する","AIが作った内容はすべて国が事前に審査する","AIの利用者に一律で高額な罰金を課す"],a:[0],e:"AI新法は、規制より「推進」を軸にしつつ、リスクにも対応する考え方の法律です。内閣に司令塔となる本部（AI戦略本部）を置くことも定められています。細かな内容はテキストで確認してください。"},
{c:4,q:"本物のように見える偽の画像・音声・動画を、AIで作り出したものを何といいますか。",ch:["ディープフェイク","ビッグデータ","スマートコントラクト","クラウドソーシング"],a:[0],e:"ディープフェイクは、なりすましや偽情報の拡散に悪用されるおそれがあります。見た目だけで本物と決めつけず、発信元や出典を確認することが大切です。"},
{c:4,q:"学習データの偏りによって、特定の属性の人などに不公平な結果を出してしまうことを何といいますか。",ch:["バイアス","オーバーフィッティング","ノイズ","レイテンシ"],a:[0],e:"AIは学習データの偏りをそのまま引き継ぐことがあります。たとえば採用の判断で、特定の性別に不利な結果が出てしまうような問題です。"},
{c:4,q:"AI事業者ガイドラインで、共通の指針として挙げられているものを2つ選んでください。",ch:["人間中心","透明性","利益の最大化","完全自動化の推進"],a:[0,1],e:"共通の指針には、人間中心、安全性、公平性、プライバシー保護、セキュリティ確保、透明性、アカウンタビリティ（説明責任）、教育・リテラシー、公正競争確保、イノベーションが含まれます。"},

{c:5,q:"生成AIに与える指示や質問の入力文を何といいますか。",ch:["プロンプト","トークン","パラメータ","アルゴリズム"],a:[0],e:"プロンプトは、AIへの「お願いの文章」です。書き方しだいで回答の質が大きく変わります。"},

{c:5,q:"例を一切示さず、指示だけでAIに答えさせるプロンプトの方法を何といいますか。",ch:["ゼロショットプロンプティング","フューショットプロンプティング","ロールプロンプティング","ファインチューニング"],a:[0],e:"ゼロショットは「お手本ゼロ」という意味です。例を数個示す方法は「フューショット」です。"},
{c:5,q:"「入力と出力の例」を数個示してから、同じ形式で答えるよう頼むプロンプトの方法を何といいますか。",ch:["フューショットプロンプティング","ゼロショットプロンプティング","強化学習","データ拡張"],a:[0],e:"フューショットは「少数のお手本つき」という意味です。例を見せることで、期待する書き方や形式が伝わりやすくなります。"},
{c:5,q:"「順を追って考えてください」と促し、途中の考え方も書かせることで、複雑な問題の正答率を上げやすくする手法はどれですか。",ch:["Chain-of-Thought","RAG","GAN","ファインチューニング"],a:[0],e:"Chain-of-Thoughtは、算数の途中式を書かせるように、考える過程を段階的に出力させる方法です。計算や論理的な推論を含む問題で効果が出やすいとされています。"},
{c:5,q:"「あなたは経験豊富な看護師です」のように、AIに役割を与えて回答の視点や口調を整える方法はどれですか。",ch:["ロールの指定","トークンの削減","回答の暗号化","データの匿名化"],a:[0],e:"役割を与えると、その立場にふさわしい視点・言葉づかい・詳しさで答えさせやすくなります。"},
{c:5,q:"「表形式で、3項目、200文字以内で」のように書くことの目的として最も適切なものはどれですか。",ch:["出力の形式や量を指定して、使いやすい回答を得やすくする","AIの学習データを書き換える","回答の著作権を自分のものにする","AIの処理速度を必ず2倍にする"],a:[0],e:"出力の形式・長さ・項目数などを指定すると、そのまま使いやすい回答になります。"},
{c:5,q:"「いい感じの文章を書いて」というプロンプトを改善する方法として、最も適切なものはどれですか。",ch:["誰に向けた何の文章か、文字数や口調などの条件を具体的に書き足す","さらに短くする","同じ文を何度も繰り返す","条件はAIに任せて何も書かない"],a:[0],e:"あいまいな指示では、AIが意図を推測するしかありません。目的・相手・条件を具体的に書くのが基本です。"},
{c:5,q:"最初の回答が思ったものと違ったときの対応として、最も適切なものはどれですか。",ch:["不足していた条件を伝えたり、修正点を指示したりして、対話しながら改善する","1回で諦めて別のAIに変える","同じプロンプトを何度も変えずに入力する","回答が間違っていても、そのまま使う"],a:[0],e:"プロンプトは一度で完成させるものではなく、回答を見ながら追加や修正を重ねて良くしていくものです。"},
{c:5,q:"プロンプトの精度を上げる工夫として適切なものを2つ選んでください。",ch:["具体的な条件や制約を示す","例を添えて期待する形式を伝える","前提や背景は省略する","あいまいな表現をそのまま使う"],a:[0,1],e:"条件を具体的に示すこと、例を添えて期待を伝えることは、どちらも基本的な工夫です。背景の省略やあいまいな表現は、精度を下げる原因になります。"}

{c:2,t:"2-1 VAE",q:"データを少ない情報に圧縮し、そこから元に近いデータを復元する仕組みを使って、新しいデータを生成するモデルはどれですか。",ch:["VAE","GAN","RNN","CNN"],a:[0],e:"圧縮する側をエンコーダ、復元する側をデコーダといいます。",n:["正解。VAE（変分自己符号化器）は、圧縮と復元の仕組みを使います。","2つのAIが競い合うモデルです。","順序のあるデータを扱う構造です。","画像の特徴を捉える構造です。"]},
{c:2,t:"2-1 Transformerモデル",q:"Transformerが、従来のRNNより優れている点として最も適切なものはどれですか。",ch:["文中の離れた言葉どうしの関係も捉えやすく、並列処理で高速に学習できる","データを1語ずつ順番にしか処理できない","画像しか扱えない","学習データが不要になる"],a:[0],e:"Attention（注意機構）により、言葉どうしの関連の強さを捉えます。",n:["正解。離れた言葉の関係を捉え、並列処理もできます。","1語ずつ順番に処理するのは、むしろRNNの特徴です。","文章だけでなく、画像などにも使われています。","学習データは必要です。"]},
{c:2,t:"2-2 GPT-1〜GPT-3.5",q:"GPTシリーズについて、正しいものはどれですか。",ch:["2022年11月に公開されたChatGPTは、GPT-3.5系のモデルをもとにしている","GPT-1が、最初にChatGPTとして公開された","GPT-4は、GPT-3より先に発表された","GPTシリーズは、画像しか扱えない"],a:[0],e:"GPT-1→GPT-2→GPT-3→GPT-3.5→GPT-4の順に進化しました。",n:["正解。GPT-3.5系のモデルをもとにしています。","GPT-1は、ChatGPTの前身にあたる初期のモデルです。","番号順どおり、GPT-3のあとにGPT-4が発表されました。","GPTシリーズは文章を扱うモデルとして始まりました。"]},
{c:2,t:"2-2 GPT-4o",q:"GPT-4oの特徴として最も適切なものはどれですか。",ch:["文字・画像・音声などを1つのモデルで扱える","文字しか扱えない","画像生成専用で、文章は扱えない","インターネットなしでしか使えない"],a:[0],e:"「o」はomni（すべて）の意味です。",n:["正解。複数の種類のデータを扱えることを、マルチモーダルといいます。","文字のほか、画像や音声も扱えます。","文章も扱える汎用モデルです。","通常は、インターネット経由のサービスとして使います。"]},
{c:2,t:"2-2 GPT-o1・o3・o4",q:"OpenAIのo1やo3のような「推論モデル」の特徴として、最も適切なものはどれですか。",ch:["回答する前に時間をかけて段階的に考え、複雑な問題に強い","最初の一言から即座に返すことだけを重視する","画像の高画質化だけを行う","検索エンジンの順位を決める"],a:[0],e:"考える時間を使うぶん、応答はやや遅くなる傾向があります。",n:["正解。数学やプログラミングなどの難しい問題に強いとされます。","むしろ、考える時間をかけるのが特徴です。","画像の高画質化のモデルではありません。","検索順位の決定とは関係ありません。"]},
{c:2,t:"2-2 Sora・Operator・Codex・GPTs",q:"次の組み合わせのうち、正しいものはどれですか。",ch:["Sora － 文章などから動画を生成するOpenAIのモデル","Operator － 画像を高画質化するツール","Codex － 音楽を生成するツール","GPTs － Googleが提供するAIの名前"],a:[0],e:"Operatorはブラウザ操作の代行、Codexはプログラミング支援、GPTsは目的別に作れるChatGPTの専用版です。",n:["正解。SoraはOpenAIの動画生成モデルです。","Operatorは、ブラウザを操作して作業を代行するエージェントです。","Codexは、プログラミングを支援するツールです。","GPTsは、OpenAIのChatGPTで作れる専用版です。"]},
{c:2,t:"2-3 Gemini・Claude・Copilot",q:"Microsoftが提供し、WordやExcelなどのOfficeアプリにも組み込まれている生成AIアシスタントはどれですか。",ch:["Copilot","Gemini","Claude","Sora"],a:[0],e:"Geminiは Google、Claudeは Anthropicのサービスです。",n:["正解。MicrosoftのCopilotです。","GeminiはGoogleの生成AIです。","ClaudeはAnthropicの生成AIです。","SoraはOpenAIの動画生成モデルです。"]},
{c:3,t:"3-1 画像生成AI",q:"Midjourney、Stable Diffusion、DALL·Eに共通する特徴はどれですか。",ch:["文章などの指示から画像を生成できる画像生成AIである","音声を文字に変換する音声認識AIである","囲碁で人間に勝つことを目的としたAIである","動画の字幕を翻訳するためだけのAIである"],a:[0],e:"画像生成AIは、拡散モデルなどを使っています。",n:["正解。文章の指示から画像を作れます。","音声を文字にするのは、音声認識です。","囲碁のAIは、AlphaGoなどです。","字幕の翻訳だけを行うAIではありません。"]},
{c:3,t:"3-1 音声生成AI",q:"文章を入力すると、人が話しているような自然な音声を作り出す技術を何といいますか。",ch:["音声合成","音声認識","画像認識","機械翻訳"],a:[0],e:"TTSはText-to-Speechの略です。",n:["正解。音声合成は、TTS（Text-to-Speech）とも呼ばれます。文章から音声を作ります。","音声から文字を作る技術で、逆の方向です。","画像から物体などを見分ける技術です。","ある言語を別の言語に置き換える技術です。"]},
{c:3,t:"3-2 ディープフェイクによる事件",q:"ディープフェイクが悪用された例として、最も適切なものはどれですか。",ch:["有名人や経営者の偽の動画・音声を使った詐欺や偽情報の拡散","天気予報の精度向上","翻訳アプリの高速化","画像の色補正"],a:[0],e:"本物らしく見えるため、見た目だけで判断しないことが大切です。",n:["正解。実際に問題になっている悪用の例です。","精度向上は、悪用の例ではありません。","高速化は、悪用の例ではありません。","色補正は、通常の画像編集です。"]},
{c:3,t:"3-3 RAGの歴史と発展",q:"RAGの考え方は、どのような課題への対応として発展したとされていますか。",ch:["LLMが、学習していない最新情報や社内情報に答えられない、誤った内容を答えるといった課題","画像の解像度が低いという課題","電力消費が大きすぎるという課題","通信速度が遅いという課題"],a:[0],e:"外部の情報を参照させることで、補うという発想です。",n:["正解。知らない情報には答えられない、誤ることがある、という課題への対応です。","解像度は、RAGが扱う課題ではありません。","消費電力は、RAGの目的ではありません。","通信速度は、RAGの目的ではありません。"]},
{c:3,t:"3-3 RAGの仕組みとメリット",q:"RAGの基本的な流れとして、正しいものはどれですか。",ch:["質問を受けたら関連情報を検索して取り出し、その情報を質問に付けてLLMに回答を生成させる","最初に全データでモデルを学習し直し、そのあとは検索しない","回答を生成したあとで、すべての情報を削除する","質問の内容にかかわらず、同じ文章を返す"],a:[0],e:"検索（Retrieval）→拡張（Augmented）→生成（Generation）の流れです。",n:["正解。検索して取り出し、質問に付け加えて生成させます。","再学習はせず、回答のたびに検索するのがRAGの特徴です。","生成後に情報を削除する仕組みではありません。","質問に応じて内容が変わります。"]},
{c:3,t:"3-3 RAGのユースケース",q:"RAGの活用例として、最も適切なものはどれですか。",ch:["社内の規程やマニュアルを参照して答える、社内問い合わせ対応","画像の色を反転させる","電子メールを暗号化する","パソコンの画面を明るくする"],a:[0],e:"社内文書やFAQを参照して答える用途が代表的です。",n:["正解。社内資料を検索して答える用途は、RAGの代表例です。","画像加工は、RAGの用途ではありません。","暗号化は、RAGの用途ではありません。","画面表示の調整は、RAGの用途ではありません。"]},
{c:3,t:"3-4 AIエージェントの仕組み",q:"AIエージェントが作業を進める流れとして、最も適切なものはどれですか。",ch:["目標を理解し、手順を計画して、道具を使って実行し、結果を見て次の行動を決める","命令を受けたら、必ず一度だけ答えて終了する","人間が最初から最後まで、すべての操作を行う","あらかじめ決められた1つの文章を表示する"],a:[0],e:"計画→実行→結果の確認→次の行動、を繰り返します。",n:["正解。計画・実行・確認を繰り返します。","一度答えて終わるのは、通常のチャットの使い方です。","人がすべて操作するなら、エージェントとはいえません。","決まった文章を出すだけでは、エージェントではありません。"]},
{c:3,t:"3-4 AIエージェントのツール事例",q:"AIエージェントの活用例として、最も適切なものはどれですか。",ch:["Webを調べて資料にまとめる、プログラムを書いて動作確認するなど、複数の手順を自動で進める","電卓で足し算だけをする","動画の再生を一時停止する","ファイル名を1つ変更するだけの操作"],a:[0],e:"複数の手順を、自分で進められるのが特徴です。",n:["正解。複数の手順を自分で進める例です。","足し算だけなら、エージェントは不要です。","単純な操作で、エージェントの例ではありません。","単純な操作で、エージェントの例ではありません。"]},
{c:3,t:"3-4 MCPと外部連携",q:"MCPを使うメリットとして、最も適切なものはどれですか。",ch:["ツールやデータごとに個別の接続を作らなくても、共通の方法でAIとつなげやすくなる","AIがインターネットに接続できなくなる","AIの回答が必ず正しくなる","AIの学習データが不要になる"],a:[0],e:"つなぎ方を共通にすることで、連携を広げやすくなります。外部につなぐときは、権限の管理にも注意します。",n:["正解。接続方法を共通化できます。","MCPは接続のための規格です。","MCPを使っても、回答が必ず正しくなるわけではありません。","学習データが不要になるわけではありません。"]},
{c:4,t:"4-1 インターネットリテラシーとは",q:"インターネットリテラシーの説明として、最も適切なものはどれですか。",ch:["ネット上の情報を正しく判断し、安全に使いこなす知識や能力","インターネット回線の速度の単位","ネットの利用を禁止するルール","ホームページを作る技術だけ"],a:[0],e:"生成AIを使う上でも、土台になる力です。",n:["正解。情報を見極め、安全に使う力です。","回線速度の単位ではありません。","禁止ではなく、上手で安全な使い方を身につけることです。","ホームページ作成に限らない、広い力のことです。"]},
{c:4,t:"4-2 フィッシング詐欺",q:"実在する企業などを装った偽のメールやWebサイトで、IDやパスワードなどを盗もうとする詐欺はどれですか。",ch:["フィッシング詐欺","ランサムウェア","ブロックチェーン","クラウドソーシング"],a:[0],e:"生成AIで自然な文面を簡単に作れるため、巧妙化が心配されています。",n:["正解。偽の連絡で情報を盗む詐欺です。","データを人質にして、身代金を要求するウイルスです。","改ざんしにくい記録の仕組みです。","不特定多数に仕事を依頼する仕組みです。"]},
{c:4,t:"4-2 悪意のあるQRコード・Wi-Fi",q:"公共の場所で、見知らぬ無料Wi-Fiや、出どころの分からないQRコードを使うときの注意として最も適切なものはどれですか。",ch:["偽のWi-Fiや不正なサイトに誘導されるおそれがあるため、提供元が確かでないものは使わない","無料なので安全であり、パスワードを入力しても問題ない","QRコードは必ず公式のものなので、読み取っても問題ない","通信が暗号化されているかどうかは、関係ない"],a:[0],e:"QRコードの移動先は、見た目では分かりません。",n:["正解。提供元が確かでないものは避けます。","無料でも、偽のWi-Fiの可能性があります。","悪意のあるQRコードもあります。","暗号化されていない通信は、内容を盗み見られるおそれがあります。"]},
{c:4,t:"4-2 ソーシャルエンジニアリング攻撃",q:"人の心理的な隙や行動のミスにつけ込んで、パスワードなどの情報を聞き出す手口を何といいますか。",ch:["ソーシャルエンジニアリング","ディープラーニング","ファインチューニング","ブレインストーミング"],a:[0],e:"コンピュータの弱点ではなく、人の弱点を突く攻撃です。",n:["正解。人の隙を突く攻撃です。","データから特徴を学ぶ技術です。","学習済みモデルを追加学習で調整する方法です。","アイデアを出し合う手法です。"]},
{c:4,t:"4-2 プライバシー設定",q:"生成AIサービスのプライバシー設定について、最も適切なものはどれですか。",ch:["入力内容がAIの学習に使われるかどうかなどを設定で確認し、必要に応じて変更する","設定は一切変更できない","初期設定のままで、必ず安全である","設定しても、学習への利用は止められない"],a:[0],e:"サービスによって設定内容が異なるため、利用前に確認します。",n:["正解。設定を確認し、必要に応じて変更します。","サービスによっては、設定を変更できます。","初期設定のままでは、学習に使われる場合があります。","サービスによっては、学習への利用を止められます。"]},
{c:4,t:"4-3 個人情報の詳細な定義",q:"個人情報保護法でいう「個人情報」として、最も適切なものはどれですか。",ch:["生存する個人に関する情報で、氏名など特定の個人を識別できるもの","会社に関する情報のすべて","亡くなった人の情報だけ","匿名で集計された統計だけ"],a:[0],e:"他の情報と容易に照合して識別できるものも含まれます。",n:["正解。生存する個人の、識別できる情報です。","会社の情報は、通常は個人情報ではありません。","対象は生存する個人です。","統計情報は、個人を特定できなければ個人情報にあたりません。"]},
{c:4,t:"4-3 要配慮個人情報",q:"本人への不当な差別や偏見が生じないよう、特に慎重な取り扱いが必要とされる「要配慮個人情報」に当てはまるものはどれですか。",ch:["病歴や信条、犯罪の経歴など","好きな食べ物","勤務先の電話番号","学校の最寄り駅"],a:[0],e:"取得には、原則として本人の同意が必要です。",n:["正解。差別や偏見につながるおそれのある情報です。","好みの情報は、通常は要配慮個人情報ではありません。","電話番号は個人情報になりうるものの、要配慮個人情報ではありません。","最寄り駅は、通常は要配慮個人情報ではありません。"]},
{c:4,t:"4-3 匿名加工情報",q:"特定の個人を識別できないように加工し、元の個人情報に戻せないようにした情報を何といいますか。",ch:["匿名加工情報","要配慮個人情報","機微情報","個人識別符号"],a:[0],e:"一定のルールのもとで、本人の同意なく活用しやすくなります。",n:["正解。個人を識別できず、元に戻せない情報です。","差別や偏見のおそれがあり、慎重な扱いが必要な個人情報です。","機微（センシティブ）情報は、他人に知られたくない、慎重に扱うべき情報の総称です。","それだけで個人を識別できる符号（マイナンバーなど）です。"]},
{c:4,t:"4-4 主な知的財産権の種類",q:"新しい発明を保護する知的財産権はどれですか。",ch:["特許権","著作権","商標権","意匠権"],a:[0],e:"著作権は創作的な表現、商標権は商品・サービスのマーク、意匠権は物のデザインを保護します。",n:["正解。発明を保護します。","文章・音楽・絵などの創作的な表現を保護します。","商品やサービスの名前・マークを保護します。","物のデザインを保護します。"]},
{c:4,t:"4-4 生成AIを利用した発明",q:"生成AIを使って作った発明について、特許庁が2024年2月時点で示した考え方として、最も適切なものはどれですか。",ch:["人が一定程度、創作活動に関与していれば、人の発明となる","AIを使った時点で、すべてAIの発明となり、人は発明者になれない","AIを使った発明は、一切特許にならない","AIが出した案をそのまま出願すれば、必ず特許になる"],a:[0],e:"2024年2月時点で特許庁が示した考え方です。文化庁の見解も、参考にします。",n:["正解。人が一定程度、創作活動に関与していることがポイントです。","AIを使っただけで、人が発明者になれなくなるわけではありません。","生成AIを使っただけで、特許にならないわけではありません。","そのまま出願すれば必ず特許になる、とはいえません。"]},
{c:4,t:"4-5 AI社会の基本理念",q:"「人間中心のAI社会原則」が掲げる基本理念に含まれるものはどれですか。",ch:["人間の尊厳が尊重される社会","AIが人間を完全に代替する社会","特定の企業が技術を独占する社会","利益の最大化だけを目指す社会"],a:[0],e:"ほかに、多様性を包摂する社会、持続可能な社会が挙げられます。",n:["正解。基本理念の1つです。","完全な代替は、理念ではありません。","技術の独占は、理念ではありません。","利益の最大化だけを目指す考え方ではありません。"]},
{c:4,t:"4-5 AIガバナンスの構築",q:"AIガバナンスの説明として、最も適切なものはどれですか。",ch:["AIのリスクを管理しつつ便益を得られるよう、組織が方針・体制・ルールを整えて運用すること","AIを一切使わないというルール","AIの開発速度を上げる技術","AIが自分でルールを作ること"],a:[0],e:"企業などの組織が、責任をもって整えます。",n:["正解。方針・体制・ルールを整えて運用することです。","使わないことではありません。","開発を速める技術ではありません。","人が責任をもって整える仕組みです。"]},
{c:4,t:"4-6 AI新法の基本構造",q:"AI新法で、国のAI政策の司令塔として内閣に置かれるとされている組織はどれですか。",ch:["AI戦略本部","AI警察","AI裁判所","AI銀行"],a:[0],e:"AI戦略本部は、AI政策の司令塔として内閣に置かれます。",n:["正解。内閣に司令塔となる本部を置くとされています。","そのような組織はありません。","そのような組織はありません。","そのような組織はありません。"]},
{c:4,t:"4-6 AI新法の内容",q:"AI新法の特徴として、最も適切なものはどれですか。",ch:["研究開発と活用の推進を軸にし、直接的な罰則を中心にした法律ではない","違反した企業に、高額の罰金を直接科す法律である","AIの研究開発を禁止する法律である","外国のAIサービスをすべて禁止する法律である"],a:[0],e:"事業者の取り組みと、国の指針づくり・協力が基本です。",n:["正解。推進を軸にした法律です。","罰金を直接科す法律ではありません。","禁止ではなく、推進が軸です。","外国のサービスを一律に禁止する法律ではありません。"]},
{c:4,t:"4-6 AI事業者ガイドラインとの関連",q:"AI新法とAI事業者ガイドラインの関係として、最も適切なものはどれですか。",ch:["法律が国の基本的な枠組みを定め、ガイドラインが事業者の具体的な取り組み方を示す","ガイドラインが、法律より強い強制力を持つ","両者は、まったく無関係である","法律ができたので、ガイドラインは廃止された"],a:[0],e:"ガイドラインは、法的な強制力のない指針です。",n:["正解。枠組みと具体的な指針という関係です。","ガイドラインに、法律のような強制力はありません。","両者は関連しています。","ガイドラインは廃止されていません。"]},
{c:5,t:"5-1 LM（言語モデル）",q:"LMの説明として、最も適切なものはどれですか。",ch:["ある言葉の次にどんな言葉が来やすいかなど、言葉の並びの確率を扱うモデル","画像から文字を読み取るモデルだけ","音を録音する機械","データを暗号化する仕組み"],a:[0],e:"大規模にしたものが、LLM（大規模言語モデル）です。",n:["正解。LM（言語モデル）は、言葉の並びを扱うモデルです。","文字の読み取りは、OCRなどの技術です。","録音機器の話ではありません。","暗号化の仕組みではありません。"]},
{c:5,t:"5-5 正確な文字数の指定",q:"テキスト生成AIに「ちょうど500文字で書いて」と頼んだときの傾向として、最も適切なものはどれですか。",ch:["正確な文字数にならないことが多いので、必要なら文字数を確認して調整する","必ずぴったり500文字になる","文字数の指定は理解できない","文字数が少ないほど必ず正確になる"],a:[0],e:"AIは文字ではなくトークン単位で処理するため、正確な文字数は苦手です。",n:["正解。確認と調整が必要です。","ぴったりになるとは限りません。","指定は理解できますが、正確さは保証されません。","文字数の少なさと正確さは、直接関係しません。"]},
{c:5,t:"5-5 計算",q:"テキスト生成AIの「計算」について、最も適切なものはどれですか。",ch:["複雑な計算や桁数の多い計算では間違えることがあるため、結果を電卓などで確認する","計算は常に正確である","計算は一切できない","計算結果の確認は不要である"],a:[0],e:"重要な計算は、必ず検算します。",n:["正解。確認が必要です。","常に正確とはいえません。","簡単な計算は、できることが多いです。","確認は必要です。"]},
{c:5,t:"5-5 最新の情報",q:"生成AIが最新のニュースを正しく答えられないことがある理由として、最も適切なものはどれですか。",ch:["学習した時点までの情報が中心で、それ以降の出来事は知らないため（検索機能を使わない場合）","AIが情報を隠しているため","最新情報は、すべて著作権で保護されているため","インターネットが使えないため、必ず答えられない"],a:[0],e:"検索機能や、RAGなどと組み合わせると補えます。",n:["正解。学習時点までの情報が中心です。","隠しているのではなく、持っていないだけです。","著作権が理由ではありません。","接続の有無だけが理由ではありません。"]},
{c:5,t:"5-5 芸術の批評",q:"「この絵画は芸術的に優れているか」といった主観的な評価について、生成AIの出力をどう扱うべきですか。",ch:["一般的な傾向をもとにした参考意見として扱い、価値の判断は人が行う","AIの評価を絶対的な正解として扱う","AIは美しさを客観的な数値で正確に測れる","芸術に評価の基準は存在しない"],a:[0],e:"正解のない問いでは、AIの出力はあくまで参考です。",n:["正解。参考にしつつ、人が判断します。","絶対的な正解とはいえません。","美しさは、客観的な数値で測れるものではありません。","基準がないわけではなく、人によって異なります。"]},
{c:5,t:"5-3 文章の校正",q:"文章の校正をAIに頼むときのプロンプトの工夫として、最も適切なものはどれですか。",ch:["修正箇所が分かるように、直した箇所と理由を一覧で示させる","修正後の文章だけを出させて、元の文章とは比較しない","「直して」とだけ書く","原文は入力しない"],a:[0],e:"変更点を確認できると、意図しない書き換えに気づけます。",n:["正解。確認して取捨選択しやすくなります。","比較できないと、意図しない変更に気づけません。","何をどう直すかが伝わりません。","原文がなければ、校正できません。"]},
{c:5,t:"5-3 対象・話者の設定変更",q:"「小学生にも分かるように」「丁寧な営業担当者の口調で」といった指定の目的は何ですか。",ch:["読み手や話し手の立場に合わせて、内容や表現を調整させる","AIの計算速度を上げる","AIを学習し直す","入力の文字数を減らす"],a:[0],e:"同じ内容でも、伝える相手によって表現が変わります。",n:["正解。対象や立場に合わせて調整します。","速度には関係しません。","プロンプトの工夫で、学習し直すわけではありません。","文字数を減らすためではありません。"]},
{c:5,t:"5-4 質問させながら一緒に進める",q:"AIに「不足している情報があれば、先に私に質問してください」と伝える利点として、最も適切なものはどれですか。",ch:["足りない条件をAIが確認してくれるため、意図に合った回答を得やすくなる","AIが質問に答えなくなる","必ず1回で完成する","個人情報を入力しなくてよくなる"],a:[0],e:"対話しながら、条件をそろえていく進め方です。",n:["正解。不足情報を確認してくれます。","質問させても、回答は得られます。","1回で完成するとは限りません。","個人情報の入力は、引き続き慎重に判断します。"]},
{c:5,t:"5-4 ブレインストーミング",q:"ブレインストーミングでの生成AIの使い方として、最も適切なものはどれですか。",ch:["多くのアイデアを出させて発想を広げ、採用するかどうかは人が判断する","出たアイデアを、すべてそのまま採用する","アイデアを1つだけ出させる","人は考えず、AIに任せきりにする"],a:[0],e:"AIは発想を広げる相手として使います。",n:["正解。発想を広げ、採否は人が決めます。","そのまま採用すると、誤りや偏りを見逃すおそれがあります。","1つだけでは、発想が広がりません。","任せきりにせず、人が判断します。"]},
{c:5,t:"5-4 業務の手順を分解",q:"「この業務を手順に分解して」とAIに頼む使い方の利点として、最も適切なものはどれですか。",ch:["手順の抜け漏れに気づきやすくなり、手順書やチェックリストにしやすくなる","業務を実行する必要がなくなる","AIの回答が必ず完璧になる","時間の見積もりが不要になる"],a:[0],e:"出た手順は、現場の実情に合わせて人が確認します。",n:["正解。整理に役立ちます。","業務の実行が不要になるわけではありません。","回答は、人が確認する必要があります。","見積もりは、人が確認します。"]},
{c:5,t:"5-4 外国語の翻訳",q:"AIで翻訳や海外宛のメールを作るときの注意として、最も適切なものはどれですか。",ch:["専門用語・言い回し・機密情報が含まれていないかを、人が確認してから送る","AIの翻訳は常に完璧なので、確認は不要","相手の国の文化や習慣は、考慮しなくてよい","機密情報は積極的に入力する"],a:[0],e:"送る前の確認は、人の責任です。",n:["正解。送る前に人が確認します。","誤訳や不自然な表現が、起こりえます。","文化や習慣への配慮も大切です。","機密情報は、むやみに入力しません。"]},
{c:1,t:"1-3 AIの4つのレベル",q:"AI搭載のエアコンのように、屋外や室内の気温に合わせて、あらかじめ決められたルールで設定温度を自動調整するAIは、4つのレベルのどれにあたりますか。",ch:["レベル1","レベル2","レベル3","レベル4"],a:[0],e:"レベル1は、入力に応じて決められたルールで出力する、条件分岐の制御です。",n:["正解。条件分岐で構成された制御プログラムです。","レベル2は、予め決められたパターンを使い、外部を観測して最適な行動を選びます。レベル1より、行動の選び方が多彩です。","レベル3は、データからルールを見つけて適応します。決められたルールだけで動くものではありません。","レベル4は、特徴量の調整も含めて自ら学習します。エアコンの単純な制御とは異なります。"]},
{c:1,t:"1-3 AIの4つのレベル",q:"検索エンジンは、4つのレベルのうち、どのレベルの例として挙げられていますか。",ch:["レベル3","レベル1","レベル2","レベル4"],a:[0],e:"レベル3は、人間が分析のコツを教え、大量のデータからルールを見つけて適応します。",n:["正解。大量のデータからルールを見つけて適応するレベルです。","レベル1の例は、AI搭載のエアコンなどです。","レベル2は、予め決められたパターンで行動を選ぶルールベースです。","レベル4の代表例は、自動車運転技術などです。"]},
{c:1,t:"1-3 AIの4つのレベル",q:"レベル3とレベル4の違いとして、最も適切なものはどれですか。",ch:["レベル3は分析のコツを人間が教えるが、レベル4は特徴量の調整も含めてAI自らが学習する","レベル3は条件分岐だけで動き、レベル4は機械学習を使う","レベル3は学習をしないが、レベル4は学習をする","違いはなく、どちらも同じものである"],a:[0],e:"特徴量を誰が決めるかが、レベル3とレベル4の大きな違いです。",n:["正解。特徴量を人が教えるのがレベル3、AI自らが調整するのがレベル4です。","条件分岐で動くのは、レベル1です。","レベル3も、データから学習します。","両者は区別されます。"]},
{c:4,t:"4-4 生成AIを利用した発明（著作物の考え方）",q:"生成AIを使って作った文章・画像・音楽について、著作物の考え方として最も適切なものはどれですか。",ch:["人が一定程度、創作活動に関与した場合は、人の著作物となる","AIが作ったものは、人の関与の程度にかかわらず、必ず著作物にならない","AIが作ったものは、指示を出した人の著作物に、必ずなる","生成AIの出力は、すべて公共のもので、誰の著作物でもない"],a:[0],e:"発明と同じように、人の創作活動への関与の程度が考え方の軸になります。",n:["正解。人が一定程度、創作活動に関与したかが軸です。","関与の程度によって、人の著作物になる場合があります。","指示を出しただけで必ず著作物になる、とはいえません。創作活動への関与の程度が軸です。","すべてが公共のものになるわけではありません。"]},
{c:4,t:"4-4 生成AIを利用した発明",q:"生成AIを利用したものの権利の考え方について、発明・特許の見解を示した機関と、著作物の見解を示した機関の組み合わせとして、正しいものはどれですか。",ch:["発明・特許は特許庁、著作物は文化庁","発明・特許は文化庁、著作物は特許庁","発明・特許は消費者庁、著作物は国税庁","発明・特許は気象庁、著作物は海上保安庁"],a:[0],e:"発明・特許は特許庁（2024年2月時点の考え方）、著作物は文化庁の見解を参考にします。",n:["正解。特許は特許庁、著作権は文化庁です。","組み合わせが逆です。","それぞれの権利を担当する機関ではありません。","それぞれの権利を担当する機関ではありません。"]}
];

10:[["学習したデータの特徴をもとに、文章・画像・音声などの新しいコンテンツを作り出すAI","学習したデータの特徴をもとに、入力されたデータを決められたカテゴリに分類するAI","学習したデータの特徴をもとに、あらかじめ登録された回答の中から最も近いものを探し出すAI","学習したデータの特徴をもとに、将来の数値や傾向を予測して数値で示すAI"],

14:[["膨大な量の文章で学習し、言葉の並びのパターンをもとに文章を生成・理解するモデル","膨大な量の画像で学習し、物体の位置や種類を見分けて画像を生成・理解するモデル","膨大な量の音声で学習し、話者ごとの声の特徴を見分けて音声を生成・理解するモデル","膨大な量の数値データで学習し、売上や気温などの数値を予測するモデル"],

20:[["質問に関連する外部の情報を検索し、その内容をもとにAIに回答を作らせる仕組み","質問に関連する過去の会話を記憶し、その内容をもとにAIに回答を作らせる仕組み","質問に関連する追加の学習データを使い、AIモデルそのものを調整し直す仕組み","質問に関連する複数の回答案を作り、その中から人が最も良いものを選ぶ仕組み"],
 ["正解。RAG（検索拡張生成）は、外部の情報を検索して、回答の材料にします。","会話の記憶は、メモリ（記憶）の仕組みです。RAGは、外部の情報を検索します。","モデルそのものの調整は、ファインチューニング（追加学習）の説明です。RAGは再学習を伴いません。","回答案から選ぶ方法は、RAGの説明ではありません。"]],
21:[["社内資料や最新情報に基づく回答をさせやすくなり、誤りを減らす助けになる","回答の速度が大幅に上がり、処理にかかる計算の負担を軽くする助けになる","回答の文章が自然になり、表現の幅を広げる助けになる","利用者の入力内容が自動で匿名化され、情報漏えいを防ぐ助けになる"],
 ["正解。最新情報や社内情報を参照でき、誤り（ハルシネーション）を減らす助けになります。","検索の手間が加わるため、速度や計算の負担を軽くすることが目的ではありません。","文章の自然さや表現の幅は、RAGの主な目的ではありません。","RAGは、入力内容を匿名化する仕組みではありません。"]],
24:[["目標を与えられると、自分で手順を考え、検索やアプリなどの道具を使いながら作業を進めるAI","質問を受けると、あらかじめ用意された手順書の内容に従って、決まった形式で回答を返すAI","質問を受けると、学習済みの知識だけを使って、検索などの道具は使わずに回答を返すAI","目標を与えられると、人が指定した手順のとおりに、画面操作を記録して再現するAI"],
 ["正解。AIエージェントは、計画を立てて道具を使い、作業を進めるAIです。","手順書どおりに答えるだけの仕組みは、エージェントの説明ではありません。","道具を使わず、学習済みの知識だけで答えるのは、通常のチャットの使い方です。","人が決めた手順を再現するだけの仕組みは、自動操作の記録に近く、自分で手順を考えるエージェントとは異なります。"]],
29:[["AIモデル自体に追加のデータを学習させ、得意分野や振る舞いを調整する","AIモデルは変えずに、質問のたびに外部の資料を検索して回答の材料にする","AIモデルは変えずに、質問文の書き方を工夫して回答の質を高める","AIモデルを一から作り直し、学習に使うデータを全部入れ替える"],
 ["正解。ファインチューニング（追加学習）は、モデル自体に追加で学習させ、調整します。","RAGの説明です。モデルは変わりません。","プロンプトの工夫（プロンプトエンジニアリング）の説明です。モデルは変わりません。","一から作る学習は、事前学習にあたります。ファインチューニングは、学習済みのモデルを調整します。"]],
31:[["入力した内容が学習に使われたり外部に漏れたりするおそれがあるため、サービスの設定や社内ルールを確認する","入力した内容が学習に使われても利用者への影響は小さいため、サービスの設定や社内ルールは確認しなくてよい","入力した内容のうち個人情報だけが保護の対象になるため、機密情報は自由に入力しても問題はない","入力した内容は利用後すぐに削除されるため、サービスごとの違いを確認する必要はない"],

33:[["一定の条件のもとで、著作権者の許諾なく利用できる","どのような場合でも、著作権者の許諾を得なければ利用できない","公開されている著作物であれば、条件を問わず自由に利用できる","利用する目的が営利か非営利かで、許諾の要否が決まる"],
 ["正解。条件付きで許諾なく利用できますが、著作権者の利益を不当に害する場合は除かれます。","一律に許諾が必要というわけではありません。","公開されていても、条件や制限があります。","許諾の要否は、営利か非営利かだけで決まるわけではありません。"]],
36:[["AIの研究開発と活用を進めつつ、不適切な利用などのリスクにも対応する","AIの研究開発と活用を進めつつ、AIを使った事業者の売上を国が補填する","AIのリスクを抑えるため、AIの研究開発に国の許可を必要とする","AIのリスクを抑えるため、特定のAIサービスの利用を国民に義務づける"],

[5,"プロンプトインジェクション","Prompt Injection","悪意のある指示を紛れ込ませ、AIに本来の指示を無視させたり、情報を漏らさせたりする攻撃。"],
[5,"生成AIの不得意なこと","","正確な計算、最新情報の把握、事実の裏付け、責任ある最終判断など。出力は人間が確認することが前提。"]
];
let TAB="quiz", GCH=0;
function glossHtml(){
  const cnt=c=>c?G.filter(g=>g[0]===c).length:G.length;
  const chips=[0,1,2,3,4,5].map(c=>`<button class="fchip" data-act="gch" data-c="${c}" aria-pressed="${GCH===c}">${c?"第"+c+"章":"すべて"}（${cnt(c)}）</button>`).join("");
  const rows=G.filter(g=>!GCH||g[0]===GCH).map(g=>`<button class="grow" data-act="gt" aria-expanded="false">
    <span class="gt"><span class="gc">第${g[0]}章</span>${esc(g[1])}</span>
    <span><span class="gh">タップで表示</span><span class="gd">${g[2]?`<span class="gf">${esc(g[2])}</span>`:""}${esc(g[3])}</span></span></button>`).join("");
  return `<section class="sheet"><h2>用語一覧</h2>
    <p class="mute small">左の用語を見て、意味を思い出してからタップしてください。説明が表示され、もう一度タップすると隠れます。</p>
    <div class="gtools">${chips}</div>
    <div class="gtools"><button class="btn" data-act="gshow">すべて表示</button><button class="btn" data-act="ghide">すべて隠す</button></div>
    <div class="glist">${rows}</div></section>`;
}

let S=null, timer=null;

/* ---------- home ---------- */
function home(){
  clearInterval(timer); S=null;
  const last=store.get("gp-last",{}), wrong=store.get("gp-wrong",[]), n=Q.length, E=Math.min(60,n);
  const rows=CH.map(c=>{
    const cnt=Q.filter(q=>q.c===c.id).length, l=last[c.id];
    const pct=l?Math.round(l.pct*100):null;
    const cls=l?(l.pct>=PASS_SAFE?"ok":l.pct>=PASS_MIN?"warn":"bad"):"";
    return `<div class="chrow">
      <div><div class="chno">第${c.id}章 ・ ${cnt}問</div><div class="chname">${esc(c.name)}</div></div>
      <div><div class="bar"><i class="${cls}" style="width:${pct||0}%"></i><u style="left:70%"></u><u style="left:80%"></u></div>
        <div class="barlab"><span>${l?"前回 "+pct+"%":"未挑戦"}</span><span>70 / 80</span></div></div>
      <button class="btn" data-act="ch" data-c="${c.id}">練習する</button></div>`}).join("");
  $app.innerHTML=`
  <div class="head">
    <div class="eyebrow">GENERATIVE AI PASSPORT ・ 2026年シラバス対応（試作版）</div>
    <h1>生成AIパスポート対策問題集</h1>
    <div class="lines"><span class="chip">全5章 <b>${n}</b>問</span><span class="chip">通しテスト <b>${E}</b>問 ・ <b>${E}</b>分</span><span class="chip">最低ライン 70%（<b>${Math.ceil(E*PASS_MIN)}</b>問）</span><span class="chip">安全圏 80%（<b>${Math.ceil(E*PASS_SAFE)}</b>問）</span></div>
    <p class="mute small">公式には合格基準が公表されていません。70%と80%は、情報サイトで多く挙げられている目安として使っています。問題はすべてオリジナルです。</p>
  </div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-t="quiz" aria-selected="${TAB==="quiz"}">問題</button><button class="tab" role="tab" data-act="tab" data-t="gloss" aria-selected="${TAB==="gloss"}">用語一覧</button></div>
  ${TAB==="gloss"?glossHtml():`<section class="sheet">
    <h2>本番想定の通しテスト</h2>
    <p>全${n}問からランダムに${E}問を選んで出題します。制限時間は${E}分で、本番の60問60分と同じです。採点は最後にまとめて行い、章ごとの正答率と、すべての問題の解答時間を表示します。</p>
    <div class="row"><button class="btn primary" data-act="exam">通しテストを始める</button>
    ${wrong.length?`<button class="btn" data-act="wrongset">間違えた問題だけ復習（${wrong.length}問）</button>`:""}</div>
  </section>
  <section class="sheet"><h2>章ごとの練習</h2>
    <p class="mute small">1問ずつ答え合わせと解説が出ます。棒グラフの縦線は、70%と80%の位置です。</p>
    <div>${rows}</div></section>`}`;
}

/* ---------- session ---------- */
function begin(items,mode,title,chap){
  S={mode,title,chap:chap||null,items:shuffle(items).map(q=>({q,order:shuffle([0,1,2,3]),sel:[],done:false,t:0})),idx:0,enter:Date.now(),t0:Date.now(),limit:mode==="exam"?items.length*60:null,finished:false,confirming:false};
  clearInterval(timer); timer=setInterval(tick,500); renderQ();
}
function leave(){const it=S.items[S.idx]; if(!it.done){it.t+=(Date.now()-S.enter)/1000} S.enter=Date.now()}
function tick(){
  if(!S||S.finished)return; const el=document.getElementById("clock"); if(!el)return;
  const now=Date.now(), it=S.items[S.idx];
  if(S.mode==="exam"){const left=S.limit-(now-S.t0)/1000; el.firstElementChild.textContent="残り"; el.lastChild.textContent=fmt(left); el.classList.toggle("low",left<300); if(left<=0)finish();}
  else{const t=it.done?it.t:it.t+(now-S.enter)/1000; el.lastChild.textContent=fmt(t)}
}
function renderQ(){
  const it=S.items[S.idx], q=it.q, multi=q.a.length>1, n=S.items.length, exam=S.mode==="exam";
  const answered=S.items.filter(x=>x.sel.length).length;
  const opts=it.order.map((oi,pos)=>{
    const sel=it.sel.includes(oi); let cls="opt";
    if(it.done){ if(q.a.includes(oi))cls+=" right"; else if(sel)cls+=" wrong"; } else if(sel)cls+=" sel";
    return `<li><button class="${cls}" data-act="pick" data-o="${oi}" ${it.done?"disabled":""}><span class="mark">${MARK[pos]}</span><span class="t">${esc(q.ch[oi])}</span></button></li>`}).join("");
  let fb="";
  if(it.done){
    const ok=isRight(it), corr=it.order.map((oi,p)=>q.a.includes(oi)?MARK[p]:null).filter(Boolean).join("・");
    fb=`<div class="fb ${ok?"ok":"bad"}"><h3>${ok?"正解です":"不正解です"}（正解：${corr}）</h3><p>${esc(q.e)}</p>${q.n?`<div class="small" style="margin-top:10px"><b>各選択肢の解説</b></div>`+notesHtml(it):""}</div>`;
  }
  const grid=exam?`<div class="sheet"><div class="small mute">問題番号（回答済み ${answered}/${n}）。押すと移動できます。</div><div class="grid">${S.items.map((x,i)=>`<button class="gb ${x.sel.length?"ans":""} ${i===S.idx?"cur":""}" data-act="go" data-i="${i}">${i+1}</button>`).join("")}</div></div>`:"";
  const last=S.idx===n-1;
  let nav;
  if(exam){
    nav=`<div class="navrow"><button class="btn" data-act="prev" ${S.idx===0?"disabled":""}>前へ</button>
      <div class="row"><button class="btn" data-act="next" ${last?"disabled":""}>次へ</button><button class="btn primary" data-act="ask">採点する</button></div></div>`;
  }else if(!it.done){
    nav=multi?`<div class="navrow"><span></span><button class="btn primary" data-act="submit" ${it.sel.length?"":"disabled"}>回答する</button></div>`:"";
  }else{
    nav=`<div class="navrow"><span></span><button class="btn primary" data-act="${last?"finish":"next"}">${last?"結果を見る":"次の問題へ"}</button></div>`;
  }
  const confirm=S.confirming?`<div class="confirm"><p><b>未回答が${n-answered}問あります。</b>${n-answered?"未回答は不正解として採点されます。":""}採点して結果を見ますか？</p><div class="row" style="margin-top:10px"><button class="btn primary" data-act="finish">採点する</button><button class="btn" data-act="cancel">続ける</button></div></div>`:"";
  $app.innerHTML=`
  <div class="topbar"><div><div class="eyebrow">${esc(S.title)}</div><div class="qno">${S.idx+1} / ${n}問</div></div>
    <div class="clock" id="clock"><small>${exam?"残り":"この問題"}</small>${exam?fmt(S.limit-(Date.now()-S.t0)/1000):fmt(it.t)}</div></div>
  <div class="prog"><i style="width:${(exam?answered:S.idx+(it.done?1:0))/n*100}%"></i></div>
  <section class="sheet">
    <div class="eyebrow">第${q.c}章 ${esc(chName(q.c))}</div>${it.done&&q.t?`<div class="src">テキストの該当箇所（目安）：${esc(q.t)}</div>`:""}
    <div class="qtext">${esc(q.q)}</div>
    ${multi?`<span class="hint">当てはまるものを2つ選んでください</span>`:""}
    <ul class="opts">${opts}</ul>${fb}${nav}${confirm}
  </section>${grid}
  <div><button class="btn" data-act="home">やめてホームに戻る</button></div>`;
  tick();
}

function pick(o){
  const it=S.items[S.idx]; if(it.done)return; const multi=it.q.a.length>1;
  if(multi){it.sel=it.sel.includes(o)?it.sel.filter(x=>x!==o):[...it.sel,o]}
  else{it.sel=[o]}
  if(S.mode==="practice"&&!multi){submit();return}
  renderQ();
}
function submit(){const it=S.items[S.idx]; if(it.done||!it.sel.length)return; it.t+=(Date.now()-S.enter)/1000; it.done=true; renderQ()}
function go(i){leave(); S.idx=i; S.confirming=false; renderQ()}

/* ---------- result ---------- */
function finish(){
  if(!S||S.finished)return; leave(); S.finished=true; clearInterval(timer);
  const wall=(Date.now()-S.t0)/1000; S.wall=wall;
  const wrong=new Set(store.get("gp-wrong",[])), last=store.get("gp-last",{});
  const per={}; S.items.forEach(it=>{const c=it.q.c; (per[c]=per[c]||{n:0,ok:0,t:0}); per[c].n++; per[c].t+=it.t; if(isRight(it)){per[c].ok++; wrong.delete(it.q.id)}else{wrong.add(it.q.id)}});
  Object.keys(per).forEach(c=>{last[c]={pct:per[c].ok/per[c].n,at:Date.now()}});
  store.set("gp-wrong",[...wrong]); store.set("gp-last",last);
  S.per=per; renderResult(false);
}
function verdict(p){
  if(p>=PASS_SAFE)return{cls:"ok",label:"合格圏です",msg:"安全圏の80%に達しています。この状態を保てれば、本番でも合格が十分に狙えます。"};
  if(p>=PASS_MIN)return{cls:"mid",label:"最低ライン付近です",msg:"最低ラインの70%には届いていますが、安全圏の80%まではあと少しです。間違えた問題と、弱い章を重点的に復習しましょう。"};
  return{cls:"low",label:"もう少し学習が必要です",msg:"最低ラインの70%に届いていません。弱い章をテキストで読み直してから、もう一度挑戦しましょう。"};
}
function renderResult(onlyWrong){
  const n=S.items.length, ok=S.items.filter(isRight).length, p=ok/n, v=verdict(p);
  const sumT=S.items.reduce((a,b)=>a+b.t,0), total=S.mode==="exam"?S.wall:sumT, avg=sumT/n;
  const weak=CH.filter(c=>S.per[c.id]&&S.per[c.id].ok/S.per[c.id].n<PASS_MIN);
  const chBars=CH.filter(c=>S.per[c.id]).map(c=>{
    const d=S.per[c.id], r=d.ok/d.n, cls=r>=PASS_SAFE?"ok":r>=PASS_MIN?"warn":"bad";
    return `<div class="chrow"><div><div class="chno">第${c.id}章</div><div class="chname">${esc(c.name)}</div></div>
      <div><div class="bar"><i class="${cls}" style="width:${r*100}%"></i><u style="left:70%"></u><u style="left:80%"></u></div>
      <div class="barlab"><span>${d.ok}/${d.n}問（${Math.round(r*100)}%）</span><span>平均 ${Math.round(d.t/d.n)}秒</span></div></div><span></span></div>`}).join("");
  const list=S.items.map((it,i)=>({it,i})).filter(({it})=>!onlyWrong||!isRight(it)).map(({it,i})=>{
    const q=it.q, good=isRight(it), lab=oi=>MARK[it.order.indexOf(oi)]+" "+q.ch[oi];
    const mine=it.sel.length?it.sel.map(lab).join(" ／ "):"（未回答）";
    return `<div class="rv"><div><span class="tag ${good?"ok":"bad"}">${good?"正解":"不正解"}</span><span class="tag ch">第${q.c}章</span><span class="mono small mute">問${i+1} ・ ${Math.round(it.t)}秒</span></div>
      <div>${esc(q.q)}</div>
      <div class="ans"><b>あなたの回答：</b>${esc(mine)}</div>
      ${good?"":`<div class="ans"><b>正解：</b>${esc(q.a.map(lab).join(" ／ "))}</div>`}
      <div class="small mute">${esc(q.e)}</div>${q.t?`<div class="src">テキスト：${esc(q.t)}</div>`:""}${notesDetail(it)}</div>`}).join("")||`<p class="mute">間違えた問題はありません。</p>`;
  const wrongIds=S.items.filter(it=>!isRight(it)).map(it=>it.q.id);
  $app.innerHTML=`
  <div class="head"><div class="eyebrow">${esc(S.title)} ・ 結果</div></div>
  <section class="verdict ${v.cls}"><div class="big">${v.label}</div>
    <div class="mono" style="font-size:18px">${ok} / ${n}問正解（${Math.round(p*100)}%）</div><p>${v.msg}</p>
    ${weak.length&&S.mode==="exam"?`<p><b>70%未満の章：</b>${weak.map(c=>"第"+c.id+"章 "+esc(c.name)).join("、")}</p>`:""}
  </section>
  <div class="stats">
    <div class="stat"><div class="k">合計時間</div><div class="v">${fmt(total)}</div></div>
    <div class="stat"><div class="k">1問あたり平均</div><div class="v">${Math.round(avg)}秒</div></div>
    <div class="stat"><div class="k">最も長くかかった問題</div><div class="v">問${S.items.indexOf(S.items.reduce((a,b)=>b.t>a.t?b:a))+1}（${Math.round(Math.max(...S.items.map(x=>x.t)))}秒）</div></div>
  </div>
  <section class="sheet"><h2>章ごとの正答率</h2><p class="mute small">縦線は70%と80%の位置です。本番でも、章ごとの正答率が結果として届きます。</p><div>${chBars}</div></section>
  <section class="sheet"><h2>全問の振り返り</h2>
    <div class="row"><button class="btn ${onlyWrong?"":"primary"}" data-act="rv-all">すべて表示</button><button class="btn ${onlyWrong?"primary":""}" data-act="rv-wrong">間違えた問題だけ（${wrongIds.length}問）</button></div>
    ${list}</section>
  <div class="row">${wrongIds.length?`<button class="btn primary" data-act="retry">間違えた問題だけ解き直す</button>`:""}<button class="btn" data-act="home">ホームに戻る</button></div>`;
  S.wrongIds=wrongIds; window.scrollTo(0,0);
}

/* ---------- events ---------- */
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled)return; const a=b.dataset.act;
  if(a==="ch"){const id=+b.dataset.c; begin(Q.filter(q=>q.c===id),"practice","第"+id+"章 "+chName(id),id)}
  else if(a==="exam")begin(shuffle(Q).slice(0,Math.min(60,Q.length)),"exam","通しテスト")
  else if(a==="wrongset"){const ids=store.get("gp-wrong",[]); begin(Q.filter(q=>ids.includes(q.id)),"practice","間違えた問題の復習")}
  else if(a==="retry"){const ids=S.wrongIds; begin(Q.filter(q=>ids.includes(q.id)),"practice","間違えた問題の解き直し")}
  else if(a==="pick")pick(+b.dataset.o)
  else if(a==="submit")submit()
  else if(a==="next"){leave(); S.idx++; S.confirming=false; renderQ()}
  else if(a==="prev"){leave(); S.idx--; S.confirming=false; renderQ()}
  else if(a==="go")go(+b.dataset.i)
  else if(a==="ask"){S.confirming=true; renderQ()}
  else if(a==="cancel"){S.confirming=false; renderQ()}
  else if(a==="finish")finish()
  else if(a==="rv-all")renderResult(false)
  else if(a==="rv-wrong")renderResult(true)
  else if(a==="tab"){TAB=b.dataset.t; home()}
  else if(a==="gch"){GCH=+b.dataset.c; home()}
  else if(a==="gt"){const o=b.classList.toggle("open"); b.setAttribute("aria-expanded",o)}
  else if(a==="gshow"||a==="ghide"){document.querySelectorAll(".grow").forEach(r=>{r.classList.toggle("open",a==="gshow"); r.setAttribute("aria-expanded",a==="gshow")})}
  else if(a==="home")home()
});
home();
</script>

</body></html>
